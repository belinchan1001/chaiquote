name: messages-catalogue

# Fail PRs and main pushes that wipe src/lib/messages.ts (Daily copy 2026-09-19).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-messages.mjs
